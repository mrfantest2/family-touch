# Family Touch enrollment API only. Never expose /admin.
ProxyPass "/family-touch/api/" "http://127.0.0.1:8797/api/" connectiontimeout=5 timeout=30
ProxyPassReverse "/family-touch/api/" "http://127.0.0.1:8797/api/"
<Location "/family-touch/api/">
    RequestHeader set X-FT-Public-Proxy "1"
    RequestHeader unset X-FT-Client-IP
    Header always set Cache-Control "no-store"
</Location>
