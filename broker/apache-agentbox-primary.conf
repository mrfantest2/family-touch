# Legacy endpoint forwards to the single primary writer on AgentBox.
# Standby promotion changes these two targets to http://127.0.0.1:8797/api/.
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName on
SSLProxyCACertificateFile "C:/laragon/etc/ssl/cacert.pem"
ProxyPass "/family-touch/api/" "https://family-api.fantest.win/api/" connectiontimeout=5 timeout=30
ProxyPassReverse "/family-touch/api/" "https://family-api.fantest.win/api/"
<Location "/family-touch/api/">
    RequestHeader set X-FT-Public-Proxy "1"
    RequestHeader unset X-FT-Client-IP
    Header always set Cache-Control "no-store"
</Location>
